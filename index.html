<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Web IDE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #101112; }
    #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
  </style>
</head>
<body>
    <div id="root"></div>
    <div id="error-log" style="color: red; position: fixed; top: 0; left: 0; z-index: 9999; background: black;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.getElementById('error-log').innerHTML += '<br/>' + msg;
      };
      window.onunhandledrejection = function(event) {
        document.getElementById('error-log').innerHTML += '<br/>Unhandled promise: ' + event.reason;
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
